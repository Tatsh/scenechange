jobs:
  check:
    permissions:
      actions: 'read'
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - env:
          COMMIT_SHA: '${{ github.sha }}'
          GH_TOKEN: '${{ github.token }}'
        id: 'check'
        name: 'Wait for workflows'
        run: |
          sha="$COMMIT_SHA"
          required_workflows=('Meson' 'Native Tests' 'Tests')
          optional_workflows=('Prettier' 'QA' 'Spelling' 'markdownlint')
          process_workflow() {
            local workflow="$1" treat_missing="$2"
            local run status conclusion
            run=$(gh run list --workflow "$workflow" --commit "$sha" --json status,conclusion --jq '.[0]') || run=''
            if [[ -z "$run" || "$run" == 'null' ]]; then
              if [[ "$treat_missing" == 'pending' ]]; then
                echo "Required workflow '$workflow' has not registered a run yet; waiting."
                return 2
              fi
              echo "Optional workflow '$workflow' did not run for this commit; skipping."
              return 0
            fi
            status=$(echo "$run" | jq -r '.status') || status=''
            conclusion=$(echo "$run" | jq -r '.conclusion') || conclusion=''
            case "$conclusion" in
              failure|cancelled|timed_out|startup_failure|action_required)
                echo "::error::Workflow '$workflow' ${conclusion}."
                return 1
                ;;
              success|skipped|neutral)
                return 0
                ;;
              *)
                if [[ "$status" == 'completed' ]]; then
                  echo "::error::Workflow '$workflow' completed with unexpected conclusion '${conclusion}'."
                  return 1
                fi
                echo "Workflow '$workflow' still pending (status=${status})."
                return 2
                ;;
            esac
          }
          for i in $(seq 1 30); do
            all_done=true
            for workflow in "${required_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" pending || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            for workflow in "${optional_workflows[@]}"; do
              rc=0
              process_workflow "$workflow" skip || rc=$?
              [[ $rc -eq 1 ]] && exit 1
              [[ $rc -eq 2 ]] && all_done=false
            done
            if [[ "$all_done" == 'true' ]]; then
              echo 'All required workflows succeeded.'
              exit 0
            fi
            echo "Waiting 60s for workflows to complete (attempt ${i}/30)..."
            sleep 60
          done
          echo '::error::Timed out waiting for workflows.'
          exit 1
  build-sdist:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97'
        with:
          python-version: '3.13'
      - name: 'Install uv'
        uses: 'astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9'
        with:
          enable-cache: false
      - name: 'Build sdist'
        run: 'uv build --sdist'
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'sdist'
          path: 'dist/*.tar.gz'
  build-wheels:
    needs:
      - 'check'
    permissions:
      contents: 'read'
    runs-on: '${{ matrix.os }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c'
        env:
          # The plugins are not Python C extensions (they are loaded at runtime
          # by VapourSynth), so a single build per platform yields a
          # Python-agnostic py3-none wheel; Meson downloads VapourSynth4.h.
          CIBW_ARCHS: '${{ matrix.cibw_archs }}'
          CIBW_BUILD: 'cp313-*'
          # hatch_build.py already emits a platform-specific tag, and the
          # plugins link nothing beyond libc and libm, so there is nothing for
          # auditwheel or delocate to vendor or retag.
          CIBW_REPAIR_WHEEL_COMMAND: ''
          CIBW_SKIP: 'pp* *-win32'
      - uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          name: 'wheels-${{ matrix.os }}-${{ matrix.cibw_archs }}'
          path: './wheelhouse/*.whl'
    strategy:
      fail-fast: false
      matrix:
        include:
          - cibw_archs: 'x86_64'
            os: 'ubuntu-latest'
          - cibw_archs: 'aarch64'
            os: 'ubuntu-24.04-arm'
          - cibw_archs: 'x86_64'
            os: 'macos-15-intel'
          - cibw_archs: 'arm64'
            os: 'macos-latest'
          - cibw_archs: 'AMD64'
            os: 'windows-latest'
          - cibw_archs: 'ARM64'
            os: 'windows-11-arm'
  publish:
    environment: 'release'
    needs:
      - 'build-sdist'
      - 'build-wheels'
    permissions:
      actions: 'read'
      contents: 'write'
      id-token: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          merge-multiple: true
          path: 'dist'
          pattern: 'wheels-*'
      - uses: 'actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c'
        with:
          name: 'sdist'
          path: 'dist'
      - uses: 'pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247'
      - env:
          EXPECTED_ZIPS: '2'
          GH_TOKEN: '${{ github.token }}'
          HEAD_SHA: '${{ github.sha }}'
        name: 'Download the Windows zips from the Meson run'
        run: |
          run_id=$(gh run list --workflow Meson --commit "$HEAD_SHA" \
            --json databaseId,conclusion --jq '[.[] | select(.conclusion == "success")][0].databaseId')
          if [[ -z "$run_id" || "$run_id" == 'null' ]]; then
            echo "::error::No successful Meson run for ${HEAD_SHA}; the Windows zips are missing."
            exit 1
          fi
          mkdir -p zips
          gh run download "$run_id" --pattern 'scenechange-release-windows-*' --dir zips
          found=$(find zips -name '*.zip' | wc -l)
          if [[ "$found" -ne "$EXPECTED_ZIPS" ]]; then
            echo "::error::Expected ${EXPECTED_ZIPS} Windows zips from run ${run_id}, found ${found}."
            find zips -type f
            exit 1
          fi
      - env:
          GH_TOKEN: '${{ github.token }}'
        name: 'Create or update draft release'
        run: |
          tag="$GITHUB_REF_NAME"
          mapfile -t assets < <(
            find dist zips -type f \( -name '*.tar.gz' -o -name '*.whl' -o -name '*.zip' \)
          )
          if [[ "${#assets[@]}" -eq 0 ]]; then
            echo '::error::No distributions or archives were staged for the release.'
            exit 1
          fi
          # Reuse the release for this tag when one already exists. Creating
          # unconditionally is what previously left the wheels in a rival draft
          # while a second record was the one published.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading into it."
          else
            gh release create "$tag" --draft --notes '' --verify-tag
          fi
          gh release upload "$tag" "${assets[@]}" --clobber
          # Assert the outcome: a release that silently lost files must fail the
          # run rather than wait to be noticed after publication.
          attached=$(gh release view "$tag" --json assets --jq '.assets | length')
          if [[ "$attached" -ne "${#assets[@]}" ]]; then
            echo "::error::Expected ${#assets[@]} assets on ${tag}, found ${attached}."
            gh release view "$tag" --json assets --jq '.assets[].name'
            exit 1
          fi
          echo "Attached ${attached} assets to ${tag}."
name: 'Publish'
'on':
  push:
    tags:
      - 'v*'
permissions: {}
