[build-system]
build-backend = "hatchling.build"
requires = ["hatchling>=1.27.0", "meson>=1.3.0", "ninja>=1.11.0", "packaging>=25.0"]

[dependency-groups]
dev = [
  "commitizen>=4.16.3",
  "cz-path>=0.0.7",
  "hatchling>=1.27.0",
  "meson>=1.3.0",
  "mypy>=2.1.0",
  "ninja>=1.11.0",
  "ruff==0.16.0",
  "ty>=0.0.49",
]
docs = [
  "autodoc-pydantic>=2.2.0",
  "doc8>=2.0.0",
  "enum-tools[sphinx]>=0.13.0",
  "esbonio>=2.0.0",
  "restructuredtext-lint>=2.0.2",
  "sphinx-datatables>=1.0.0",
  "sphinx-immaterial>=0.13.9",
  "sphinx>=9.1.0; python_version >= \"3.13\"",
]
tests = [
  "coveralls>=4.1.0",
  "mock>=5.2.0",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.0",
]

[project]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Plugins",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Video",
  "Typing :: Typed",
]
dependencies = ["vapoursynth>=75"]
description = "Scene change detection plugin for VapourSynth."
keywords = ["plugin", "vapoursynth"]
license = "LGPL-2.1-or-later"
name = "vapoursynth-scenechange"
readme = "README.md"
requires-python = ">=3.12,<4.0"
version = "0.4.0"

[[project.authors]]
email = "audvare@gmail.com"
name = "Andrew Udvare"

[[project.authors]]
email = "chikuzen.mo@gmail.com"
name = "Oka Motofumi"

[project.urls]
Issues = "https://github.com/Tatsh/scenechange/issues"
documentation = "https://scenechange.readthedocs.org"
homepage = "https://tatsh.github.io/scenechange/"
repository = "https://github.com/Tatsh/scenechange"

[tool.commitizen]
name = "cz_path"
remove_path_prefixes = ["include", "native", "scenechange"]
tag_format = "v$version"
version_files = [
  ".wiswa.jsonnet",
  "CITATION.cff",
  "README.md",
  "docs/badges.rst",
  "docs/index.rst",
  "package.json",
  "scenechange/__init__.py",
  "meson.build",
  "native/scenechange.c",
  "native/temporalsoften.c",
]
version_provider = "pep621"

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:"]
omit = ["conftest.py", "tests.py", "tests/*/test_*.py", "tests/test_*.py"]
show_missing = true

[tool.coverage.run]
branch = true
omit = ["conftest.py", "tests.py", "tests/*/test_*.py", "tests/test_*.py"]

[tool.doc8]
max-line-length = 100

[tool.hatch.build.targets.sdist]
include = [
  "/Doxyfile.in",
  "/LICENSE.txt",
  "/README.md",
  "/hatch_build.py",
  "/meson.build",
  "/meson.options",
  "/native",
  "/pyproject.toml",
  "/scenechange",
  "/tools",
]

[tool.hatch.build.targets.wheel]
artifacts = ["vapoursynth/plugins/*.dll", "vapoursynth/plugins/*.dylib", "vapoursynth/plugins/*.so"]
include = ["/scenechange", "/vapoursynth/plugins"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.mypy]
cache_dir = "~/.cache/mypy"
explicit_package_bases = true
platform = "linux"
python_version = "3.12"
show_column_numbers = true
strict = true
strict_optional = true
warn_unreachable = true

[tool.pyright]
deprecateTypingAliases = true
enableExperimentalFeatures = true
exclude = [".venv", "**/node_modules", "**/__pycache__", "**/.*"]
include = ["./scenechange", "./tests"]
pythonPlatform = "Linux"
pythonVersion = "3.12"
reportCallInDefaultInitializer = "warning"
reportImplicitOverride = "warning"
reportImportCycles = "error"
reportMissingModuleSource = "error"
reportPropertyTypeMismatch = "error"
reportUnnecessaryTypeIgnoreComment = "none"
typeCheckingMode = "off"
venv = ".venv"
venvPath = "."

[tool.pytest.ini_options]
mock_use_standalone_module = true
norecursedirs = ["node_modules"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["tests"]

[tool.ruff]
cache-dir = "~/.cache/ruff"
force-exclude = true
line-length = 100
namespace-packages = ["docs", "tests", "tools"]
target-version = "py312"
unsafe-fixes = true

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"
preview = true
quote-style = "single"

[tool.ruff.lint]
extend-select = ["ALL"]
ignore = [
  "ANN401",
  "COM812",
  "CPY001",
  "D203",
  "D204",
  "D212",
  "N818",
  "Q000",
  "Q003",
  "S404",
  "S603",
  "TD002",
]
preview = true

[tool.ruff.lint.flake8-builtins]
allowed-modules = ["types", "typing"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"

[tool.ruff.lint.isort]
case-sensitive = true
combine-as-imports = true
from-first = true
required-imports = ["from __future__ import annotations"]
section-order = ["future", "standard-library", "third-party", "local-folder"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["test_*"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.pylint]
max-args = 20
max-branches = 20
max-locals = 20
max-positional-args = 15
max-public-methods = 30
max-returns = 10
max-statements = 100

[tool.uv]
default-groups = "all"
exclude-newer = "1 week"
